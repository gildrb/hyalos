<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A local, deterministic visual laboratory built with TypeScript, Preact and vGPU.">
  <title>hyalos / visual laboratory</title>
  <link rel="icon" href="./mark.svg" type="image/svg+xml">
  <style>
    html { background: oklch(.15 .004 260); color: oklch(.89 .008 85); }
    body { margin: 0; }
    [hidden] { display: none !important; }
    .startup-card { max-width: 580px; margin: 14vh auto; padding: 32px; font: 15px/1.7 system-ui,sans-serif; }
    .startup-card h1 { font-size: 24px; font-weight: 500; }
    .startup-card pre { white-space: pre-wrap; padding: 16px; border: 1px solid oklch(.3 .004 260); }
  </style>
  <!-- Kept independent of GPU/JavaScript startup. Vite+ bundles this relative stylesheet. -->
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="boot-shell" class="startup-card" role="status">
    <p>hyalos / visual laboratory</p>
    <h1>Opening the editor.</h1>
    <p id="startup-detail">Loading TypeScript and Preact application modules.</p>
    <pre>npm install
npm run dev</pre>
    <p>Open the localhost URL printed by Vite+. For a static host, upload the contents of dist after npm run build.</p>
    <noscript>This editor requires JavaScript.</noscript>
  </div>
  <div id="app"></div>
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('startup-detail').textContent = 'This is source HTML, not a standalone application. Run the commands below instead of double-clicking this file.';
    } else {
      window.__hyalosBootTimer = setTimeout(function () {
        document.getElementById('startup-detail').textContent = 'The application module did not load. Check the server URL and deploy the whole build, not just index.html. See the browser console for the failed request.';
      }, 12000);
    }
  </script>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
