name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-build-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: '22'
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp test
      - run: vp run build
      - run: vp exec playwright install --with-deps chromium
      - run: vp run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-and-base-path-failures
          path: test-results/
  webgpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: '22'
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp exec playwright install --with-deps chromium
      - run: sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth
      - run: xvfb-run -a vp run test:gpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgpu-evidence
          path: test-results/
          if-no-files-found: warn
