name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-build-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Install dependencies
        shell: bash
        run: |
          if test -f package-lock.json; then
            npm ci
          else
            echo '::warning::Bootstrap install without a committed lockfile. Commit the generated lockfile before merging.'
            npm install
          fi
      - name: Preserve the generated dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: package-lock.json
          if-no-files-found: error
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Require a committed lockfile before merge
        run: git ls-files --error-unmatch package-lock.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-and-base-path-failures
          path: test-results/
  webgpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        shell: bash
        run: |
          if test -f package-lock.json; then npm ci; else npm install; fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:gpu
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gpu-test-failures
          path: test-results/
